name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64
          chmod +x kubeconform-linux-amd64
          sudo mv kubeconform-linux-amd64 /usr/local/bin/kubeconform

      - name: Run yamllint
        run: yamllint -d relaxed yaml/

      - name: Run kubeconform
        run: kubeconform -strict -kubernetes-version 1.34.0 -schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone yaml/
